storeDir: .cache/pnpm-store
cacheDir: .cache/pnpm
updateNotifier: false
enableGlobalVirtualStore: false
allowBuilds:
  esbuild: set this to true or false
  "esbuild@0.25.4 || 0.27.0 || 0.28.1 || 0.28.2": true
  "workerd@1.20261001.1": true
  workerd: set this to true or false
# Restrict security backports to the CLI/build consumers that pin affected versions.
overrides:
  "@vercel/frameworks@3.29.0>js-yaml": "3.15.2"
  "@vercel/frameworks@3.29.0>smol-toml": "1.7.1"
  "@module-federation/dts-plugin@2.9.0>adm-zip": "0.6.1"
  "@module-federation/dts-plugin@2.9.0>undici": "7.29.1"
  "typeid-js@1.2.0>uuid": "11.1.1"
# Exact pinned adapter releases already installed, audited and locally tested.
minimumReleaseAgeExclude:
  - '@opennextjs/aws@4.1.7'
  - '@opennextjs/cloudflare@1.20.8'
  - wrangler@4.147.0
